 function polygon(points,color){g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fillStyle=color;g.fill()}
 function ground(x,y,dx,dy,color){polygon([[x,y],[x+dx,y],[x+dx,y+dy],[x,y+dy]].map(([a,b])=>project(a,b,0)),color)}
 ground(-250,-230,500,460,'#647175');ground(-250,-13,500,29,'#354149');for(let x=-240;x<=240;x+=24)ground(x,0,12,1,'#bca87a');for(let y=-12;y<=12;y+=4)ground(-53,y,9,2,'#b7c4c3');
 const buildings=[[-104,-66,35,34,51],[-58,-71,30,37,66],[0,-51,45,33,39],[60,-67,32,44,64],[104,-69,30,41,78],[-103,38,31,29,32],[81,39,34,35,52]];
 const faces=[];function face(v,col){const a=v.map(pt=>project(...pt));faces.push([a.reduce((z,b)=>z+b[2],0)/a.length,a,col])}
 for(const [x,y,dx,dy,z] of buildings){let shelter=x===0;const A=[x,y],B=[x+dx,y],C=[x+dx,y+dy],D=[x,y+dy],roof=[A,B,C,D];roof.forEach((a,i)=>{const b=roof[(i+1)%4];face([[...a,0],[...b,0],[...b,z],[...a,z]],shelter?['#467470','#518a83','#61978e','#345f61'][i]:['#555967','#696975','#8a7774','#646172'][i]);for(let n=1;n<6;n++)for(let k=7;k<z-2;k+=10){let v=n/6,q=v+.06,pt=(u,zz)=>[mix(a[0],b[0],u),mix(a[1],b[1],u),zz];if(shelter&&i===2&&n===3&&k===7)continue;face([pt(v,k),pt(q,k),pt(q,k+3),pt(v,k+3)],'#bfd3ca')}});face(roof.map(a=>[...a,z]),shelter?'#96b2a7':'#a19795')}
 faces.sort((a,b)=>a[0]-b[0]);faces.forEach(([,v,c])=>polygon(v,c));
 for(let i=0;i<49;i++){let x=i*47%231-115,y=i*37%26-11,z=(1-((progress*3+i*.321)%1))*11;let [a,b]=project(x,y,z);g.fillStyle='#e0b6fa';g.beginPath();g.arc(a,b,Math.max(1,scale),0,tau);g.fill()}
 let x,y;if(progress<.22){x=-35;y=11}else if(progress<.58){let u=(progress-.22)/.36;x=mix(-35,22,u);y=mix(11,-18,u)}else{x=22;y=mix(-18,-36,clamp((progress-.58)/.24,0,1))}
 let [px,py]=project(x,y,2);g.strokeStyle='#ffab59';g.lineWidth=3;g.beginPath();g.arc(px,py,7,0,tau);g.stroke();g.fillStyle='#fff1cd';g.beginPath();g.arc(px,py,3,0,tau);g.fill();
 if(progress>=.58){g.font='600 13px system-ui';let label=t('Dentro del refugio','Inside shelter');let tw=g.measureText(label).width;g.fillStyle='#172622';g.fillRect(px-tw/2-5,py-30,tw+10,18);g.fillStyle='#f6ecdc';g.fillText(label,px-tw/2,py-17)}
}
new ResizeObserver(queue).observe(canvas);refresh();update();
